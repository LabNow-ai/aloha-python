# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      all-github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/pkg"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      all-pip:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      all-pip:
        patterns:
          - "*"
