# .readthedocs.yaml
# Read the Docs configuration for the bilingual MkDocs site.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details.

version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3"
  jobs:
    pre_create_environment:
      - cp ./README.md ./pkg/
    pre_build:
      - |
        case "${READTHEDOCS_LANGUAGE:-en}" in
          zh*) cp ./doc/mkdocs.zh.yml ./doc/mkdocs.yml ;;
        esac

mkdocs:
  configuration: ./doc/mkdocs.yml

python:
  install:
    - method: pip
      path: ./pkg
      extra_requirements:
        - all
